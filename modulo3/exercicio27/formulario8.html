<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="ola.php" method="post">
        <p>
            <label for="in1">Numero1:</label>
            <input type="number" name="n1" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value)+ Number(in2.value)">
            <br>
           
            <label for="in2">Numero2:</label>
            <input type="number" name="nr1" id="in2" min="0" max="50" required
            oninput="isoma.innerHTML = Number(in1.value)+ Number(in2.value)">
        </p>
        <p>
            <label for="isoma">Soma: </label>
            <output id="isoma"></output>
        </p>
    </form>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Apagar">
    </p>
    
</body>
</html>
